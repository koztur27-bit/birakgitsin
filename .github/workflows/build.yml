# Bırak Gitsin - CI: dev ve user (Play) APK üretimi
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (android yoksa)
        if: hashFiles('android/gradlew') == ''
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: aapt2 ayari
        run: |
          mkdir -p android
          touch android/gradle.properties
          AAPT2="${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools/36.0.0/aapt2"
          if [ -x "$AAPT2" ]; then
            grep -q '^android.aapt2FromMavenOverride=' android/gradle.properties || \
              echo "android.aapt2FromMavenOverride=$AAPT2" >> android/gradle.properties
          fi

      - name: Surum bilgisini al
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Surum: $V"

      - name: Build flag DEV
        run: |
          echo '// Build-time flag.' > src/lib/buildFlags.ts
          echo '// false = developer build, true = user/Play build' >> src/lib/buildFlags.ts
          echo 'export const IS_USER_RELEASE = false;' >> src/lib/buildFlags.ts
          cat src/lib/buildFlags.ts

      - name: Gradle release APK DEV
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: DEV APK topla
        run: |
          APK="$(find . -type f -name 'app-release.apk' -path '*android/app/build/outputs/apk/release/*' -print -quit 2>/dev/null)"
          if [ -z "$APK" ]; then
            APK="$(find . -type f -name 'app-release.apk' -print -quit 2>/dev/null)"
          fi
          if [ -z "$APK" ]; then
            echo "HATA: DEV APK uretilmedi."
            exit 1
          fi
          cp "$APK" ./birakgitsin-dev-v${{ steps.ver.outputs.version }}.apk
          ls -lh ./birakgitsin-dev-v${{ steps.ver.outputs.version }}.apk

      - name: Build flag USER
        run: |
          echo '// Build-time flag.' > src/lib/buildFlags.ts
          echo '// false = developer build, true = user/Play build' >> src/lib/buildFlags.ts
          echo 'export const IS_USER_RELEASE = true;' >> src/lib/buildFlags.ts
          cat src/lib/buildFlags.ts

      - name: JS bundle ara ciktilari temizle
        run: |
          rm -rf android/app/build/generated/assets || true
          rm -rf android/app/build/intermediates/assets || true
          rm -rf android/app/build/intermediates/react || true
          rm -rf android/app/build/outputs/apk/release || true

      - name: Gradle release APK USER
        run: |
          cd android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: USER APK topla
        run: |
          APK="$(find . -type f -name 'app-release.apk' -path '*android/app/build/outputs/apk/release/*' -print -quit 2>/dev/null)"
          if [ -z "$APK" ]; then
            APK="$(find . -type f -name 'app-release.apk' -print -quit 2>/dev/null)"
          fi
          if [ -z "$APK" ]; then
            echo "HATA: USER APK uretilmedi."
            exit 1
          fi
          cp "$APK" ./birakgitsin-user-v${{ steps.ver.outputs.version }}.apk
          ls -lh ./birakgitsin-dev-v${{ steps.ver.outputs.version }}.apk ./birakgitsin-user-v${{ steps.ver.outputs.version }}.apk

      - name: APKleri Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ${{ format('APK - son surum (v{0})', steps.ver.outputs.version) }}
          body: ${{ format('Guncel APK v{0} (dev + user). Dev: gelistirici araclari acik. User: temiz musteri/Play surumu.', steps.ver.outputs.version) }}
          files: |
            ./birakgitsin-dev-v${{ steps.ver.outputs.version }}.apk
            ./birakgitsin-user-v${{ steps.ver.outputs.version }}.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-dev-user
          path: |
            ./birakgitsin-dev-v${{ steps.ver.outputs.version }}.apk
            ./birakgitsin-user-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 1
