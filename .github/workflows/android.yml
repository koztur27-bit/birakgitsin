name: Android APK (EAS local build)

# EAS bulut kotasını HARCAMAZ: derleme GitHub sunucusunda yerelde (--local) yapılır.
# İmzalama, EAS'in yönettiği mevcut keystore ile otomatik yapılır -> aynı imza,
# kurulumda veriler korunur.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS derleme profili"
        type: choice
        default: preview
        options:
          - preview
          - development
          - production
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Versions
        run: |
          node -v
          java -version
          npx eas-cli --version

      - name: Build APK locally (no EAS cloud quota)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          CI: "1"
        run: |
          npx eas-cli build \
            --local \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --non-interactive \
            --output ./birakgitsin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: birakgitsin-apk
          path: ./birakgitsin.apk
          if-no-files-found: error
          retention-days: 30
