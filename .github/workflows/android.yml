name: Android APK (EAS local build)

# EAS bulut kotasını HARCAMAZ: derleme GitHub sunucusunda yerelde (--local) yapılır.
# İmzalama, EAS'in yönettiği mevcut keystore ile otomatik yapılır -> aynı imza,
# kurulumda veriler korunur.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS derleme profili"
        type: choice
        default: preview
        options:
          - preview
          - development
          - production
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "platforms:"; ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "${ANDROID_HOME}/build-tools" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Versions
        run: |
          node -v
          java -version
          npx eas-cli --version

      - name: Build APK locally (no EAS cloud quota)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          CI: "1"
        run: |
          npx eas-cli build \
            --local \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --non-interactive \
            --output ./birakgitsin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: birakgitsin-apk
          path: ./birakgitsin.apk
          if-no-files-found: error
          retention-days: 30
